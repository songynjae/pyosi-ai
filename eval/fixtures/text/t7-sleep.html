<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 390px; height: 844px; position: relative; overflow: hidden; font: 14px/1.35 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; color: #1c2230; background: #f3f4f8; }
  .status { height: 38px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-weight: 600; font-size: 13px; }
  .batt { width: 24px; height: 11px; border: 1.5px solid #1c2230; border-radius: 3px; position: relative; }
  .batt::after { content: ""; position: absolute; left: 1.5px; top: 1.5px; bottom: 1.5px; width: 10px; background: #1c2230; border-radius: 1px; }
  .head { display: flex; align-items: center; justify-content: space-between; padding: 6px 16px 4px; }
  h1 { font-size: 24px; margin: 0; }
  .right { display: flex; align-items: center; gap: 14px; }
  .seg { display: flex; margin: 8px 16px 0; background: #e6e9f1; border-radius: 10px; padding: 3px; }
  .seg span { flex: 1; text-align: center; padding: 6px 0; border-radius: 8px; font-weight: 600; font-size: 13px; color: #5a6478; }
  .seg .on { background: #fff; color: #1c2230; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .now { padding: 12px 16px 2px; display: flex; align-items: baseline; gap: 10px; }
  .big { font-size: 36px; font-weight: 700; letter-spacing: -0.5px; }
  .sub { color: #6b7280; font-size: 13px; }
  .card { background: #fff; border: 1px solid #e3e6ee; border-radius: 12px; margin: 8px 16px 0; }
  .chart { padding: 8px 6px 2px; }
  .stats { display: flex; gap: 8px; margin: 8px 16px 0; }
  .stat { flex: 1; background: #fff; border: 1px solid #e3e6ee; border-radius: 10px; padding: 8px 10px; }
  .stat b { display: block; font-size: 16px; }
  .stat span { font-size: 11px; color: #6b7280; }
  .toggle { margin: 8px 16px 0; background: #fff; border: 1px solid #e3e6ee; border-radius: 12px; padding: 9px 12px; display: flex; align-items: center; justify-content: space-between; }
  .sw { width: 38px; height: 22px; border-radius: 999px; background: #5b8def; position: relative; }
  .sw::after { content: ""; position: absolute; right: 2px; top: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; }
  .rows { margin: 8px 16px 0; background: #fff; border: 1px solid #e3e6ee; border-radius: 12px; }
  .row { display: flex; align-items: center; padding: 7px 12px; border-bottom: 1px solid #eef0f4; }
  .row:last-child { border-bottom: 0; }
  .row .d { width: 84px; color: #6b7280; font-size: 13px; }
  .row .v { flex: 1; font-weight: 600; }
  .add { margin: 10px 16px 0; height: 44px; border-radius: 12px; background: #5b8def; color: #fff; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: #fff; border-top: 1px solid #e3e6ee; display: flex; align-items: flex-start; justify-content: space-around; padding-top: 10px; }
  svg { display: block; }
</style>
</head>
<body data-width="390">
<div class="status"><span>7:05</span><div class="batt"></div></div>
<div class="head">
  <h1>Sleep</h1>
  <div class="right">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4b5563" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M8 8l4-4 4 4"/><path d="M5 13v6h14v-6"/></svg>
  </div>
</div>
<div class="seg"><span class="on" data-t="t7_week">Week</span><span>Month</span><span>Year</span></div>
<div class="now"><div class="big" data-t="t7_big">7h 16m</div><div class="sub">average this week</div></div>
<div class="card chart">
<svg width="342" height="192" viewBox="0 0 342 192">
<line x1="40" x2="326" y1="132.0" y2="132.0" stroke="#eef0f4"/><text x="32" y="136.0" text-anchor="end" font-size="10" fill="#8a93a5">2h</text><line x1="40" x2="326" y1="102.0" y2="102.0" stroke="#eef0f4"/><text x="32" y="106.0" text-anchor="end" font-size="10" fill="#8a93a5">4h</text><line x1="40" x2="326" y1="72.0" y2="72.0" stroke="#eef0f4"/><text x="32" y="76.0" text-anchor="end" font-size="10" fill="#8a93a5">6h</text><line x1="40" x2="326" y1="42.0" y2="42.0" stroke="#eef0f4"/><text x="32" y="46.0" text-anchor="end" font-size="10" fill="#8a93a5">8h</text><line x1="40" x2="326" y1="12.0" y2="12.0" stroke="#eef0f4"/><text x="32" y="16.0" text-anchor="end" font-size="10" fill="#8a93a5">10h</text>
<rect x="48.4" y="49.5" width="24" height="112.5" rx="4" fill="#5b8def"/><text x="60.4" y="184" text-anchor="middle" font-size="10" fill="#8a93a5">Mon</text><rect x="89.3" y="55.5" width="24" height="106.5" rx="4" fill="#5b8def"/><text x="101.3" y="184" text-anchor="middle" font-size="10" fill="#8a93a5">Tue</text><rect x="130.1" y="60.0" width="24" height="102.0" rx="4" fill="#5b8def"/><text x="142.1" y="184" text-anchor="middle" font-size="10" fill="#8a93a5">Wed</text><rect x="171.0" y="39.0" width="24" height="123.0" rx="4" fill="#5b8def"/><text x="183.0" y="184" text-anchor="middle" font-size="10" fill="#8a93a5">Thu</text><rect x="211.9" y="76.5" width="24" height="85.5" rx="4" fill="#f08a3c"/><text x="223.9" y="184" text-anchor="middle" font-size="10" fill="#8a93a5">Fri</text><rect x="252.7" y="33.0" width="24" height="129.0" rx="4" fill="#5b8def"/><text x="264.7" y="184" text-anchor="middle" font-size="10" fill="#8a93a5">Sat</text><rect x="293.6" y="57.0" width="24" height="105.0" rx="4" fill="#5b8def"/><text x="305.6" y="184" text-anchor="middle" font-size="10" fill="#8a93a5">Sun</text>
<g data-t="t7_goal"><line x1="40" x2="326" y1="42.0" y2="42.0" stroke="#c2c9d6" stroke-width="1.5" stroke-dasharray="5 4"/><text data-t="t7_goal_label" x="42" y="37.0" font-size="10" fill="#b0b7c6">Goal 8h</text></g>
<g data-t="t7_tooltip"><rect x="183.9" y="46.5" width="80" height="22" rx="6" fill="#1c2230"/><text x="223.9" y="61.5" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Fri · 5h 42m</text></g>
</svg>
</div>
<div class="stats"><div class="stat" data-t="t7_deep"><span>Deep sleep</span><b>1h 32m</b></div><div class="stat"><span>Bedtime</span><b>23:40</b></div><div class="stat"><span>Wake up</span><b>06:55</b></div></div>
<div class="toggle"><span>Bedtime reminder</span><div class="sw"></div></div>
<div class="rows">
<div class="row"><span class="d">Sun night</span><span class="v">7h 00m</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9aa3b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-t="t7_chev1"><path d="M9 5l7 7-7 7"/></svg></div>
<div class="row"><span class="d">Sat night</span><span class="v">8h 36m</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9aa3b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-t="t7_chev2"><path d="M9 5l7 7-7 7"/></svg></div>
<div class="row"><span class="d">Fri night</span><span class="v">5h 42m</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9aa3b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-t="t7_chev3"><path d="M9 5l7 7-7 7"/></svg></div>
</div>
<div class="add" data-t="t7_add">Log sleep</div>
<div class="bar" data-t="t7_bar">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5b8def" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4 6.5 6.5 0 0 0 20 14.5z"/></svg>
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17h12l-1.5-2.2V10a4.5 4.5 0 0 0-9 0v4.8L6 17z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" data-t="t7_profile"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/></svg>
</div>
</body>
</html>
