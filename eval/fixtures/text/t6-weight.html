  .delta { color: #15803d; font-weight: 600; font-size: 13px; }
  .card { background: #fff; border: 1px solid #e5e8ef; border-radius: 12px; margin: 8px 16px 0; }
  .chart { padding: 8px 6px 2px; }
  .stats { display: flex; gap: 8px; margin: 8px 16px 0; }
  .stat { flex: 1; background: #fff; border: 1px solid #e5e8ef; border-radius: 10px; padding: 8px 10px; }
  .stat b { display: block; font-size: 16px; }
  .stat span { font-size: 11px; color: #6b7280; }
  .rows { margin: 8px 16px 0; background: #fff; border: 1px solid #e5e8ef; border-radius: 12px; }
  .row { display: flex; align-items: center; padding: 7px 12px; border-bottom: 1px solid #eef0f4; }
  .row:last-child { border-bottom: 0; }
  .row .d { width: 56px; color: #6b7280; font-size: 13px; }
  .row .v { width: 70px; font-weight: 600; }
  .row .n { flex: 1; color: #6b7280; font-size: 13px; }
  .row svg { margin-left: 10px; }
  .add { margin: 10px 16px 0; height: 44px; border-radius: 12px; background: #2d6cdf; color: #fff; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: #fff; border-top: 1px solid #e5e8ef; display: flex; align-items: flex-start; justify-content: space-around; padding-top: 10px; }
